name: Bug
description: Something in the app does not match what the code should do
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Route, what you did, and what you expected.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data
      description: Seed only, or after pnpm db:import? Do not paste secrets or a password.
    validations:
      required: true
