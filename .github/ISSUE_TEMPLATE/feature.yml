name: Feature
description: A farm task this app does not cover yet
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: Farm task
      description: What the operator is trying to record or look up.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: What goes wrong without it. Do not claim a harvest or cost result unless you have measurements.
    validations:
      required: false
